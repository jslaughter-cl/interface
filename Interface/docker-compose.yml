version: '3.8'

services:
  # Laravel Application Service (PHP-FPM)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: laravel-app-image
    container_name: laravel_app
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    networks:
      - laravel-vue-network

  # Nginx Service
  nginx:
    image: nginx:alpine
    container_name: nginx_server
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf # You need to create this config file
    networks:
      - laravel-vue-network

  # MySQL Database Service
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: v2M9Kq4N7xRzW5bP8tHjYc6LgS1fD3nA
      MYSQL_DATABASE: interface_dev
      MYSQL_USER: admin
      MYSQL_PASSWORD: vG6kP2wM8rT5xZ9nB4qS
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - laravel-vue-network

  # Node/NPM service for frontend asset compilation (for development)
  node:
    image: node:20-alpine # Use an appropriate Node version
    container_name: vue_builder
    volumes:
      - .:/var/www/html
    working_dir: /var/www/html
    entrypoint: npm # Default command to run
    networks:
      - laravel-vue-network
    # Expose the Vite HMR port
    ports:
      - "5173:5173"

volumes:
  dbdata: {}

networks:
  laravel-vue-network:
    driver: bridge
